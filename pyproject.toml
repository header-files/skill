[project]
name = "skill"
version = "0.1.0"
description = "Local Skill Runtime with LLM tool loop, plus RAG and multi-protocol LLM"
readme = "README.md"
authors = [
    { name = "header-files", email = "1994707436@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.9.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "numpy>=2.0.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "typer>=0.27.2",
    "uvicorn>=0.32.0",
]

[project.scripts]
llm-chat = "llm.cli.main:app"
rag = "rag.cli.main:app"
skill = "skill.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/llm", "src/rag", "src/api", "src/skill"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
